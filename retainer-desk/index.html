<title>Retainer Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: top bar with tabs, a month switcher, then summary tiles → follow-up list → deliverable cards. */
:root {
  --bg: #f4f6f8; --surface: #ffffff; --surface-2: #eef2f5; --ink: #15202b; --muted: #5a6876; --line: #dbe2e8;
  --accent: #0e5a61; --accent-ink: #ffffff; --accent-soft: #dcefee;
  --red: #b3232d; --red-soft: #fbe6e7; --amber: #965600; --amber-soft: #fcefd6; --green: #1b7542; --green-soft: #e0f3e7;
  --shadow: 0 1px 2px rgba(20,40,60,.06), 0 6px 24px rgba(20,40,60,.06);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1317; --surface: #161d23; --surface-2: #1d262d; --ink: #e5ebef; --muted: #93a1ad; --line: #2a343d;
  --accent: #5fc4c1; --accent-ink: #0b1d1f; --accent-soft: #163739;
  --red: #ff8086; --red-soft: #3a1c20; --amber: #f2b45a; --amber-soft: #382912; --green: #70d49c; --green-soft: #15301f;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1317; --surface: #161d23; --surface-2: #1d262d; --ink: #e5ebef; --muted: #93a1ad; --line: #2a343d;
  --accent: #5fc4c1; --accent-ink: #0b1d1f; --accent-soft: #163739;
  --red: #ff8086; --red-soft: #3a1c20; --amber: #f2b45a; --amber-soft: #382912; --green: #70d49c; --green-soft: #15301f;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 16px; padding-block: 12px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: -.01em; margin-right: auto; display: flex; align-items: center; gap: 10px; }
.brand i { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); display: inline-grid; place-items: center; color: var(--accent-ink); font-style: normal; font-size: 14px; }
nav.tabs { display: flex; gap: 4px; }
nav.tabs a { text-decoration: none; color: var(--muted); padding: 7px 12px; border-radius: 8px; font-weight: 500; }
nav.tabs a[aria-current="page"] { color: var(--ink); background: var(--surface-2); }
button { font: inherit; cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 7px 12px; border-radius: 8px; font-weight: 500; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--red); }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 28px; height: 28px; border-radius: 7px; font-size: 16px; line-height: 1; display: inline-grid; place-items: center; }
.iconbtn:hover { border-color: var(--accent); color: var(--accent); }
main { padding-block: 20px 60px; display: grid; gap: 28px; }
.bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.bar h1 { font-family: var(--f-display); font-size: 26px; margin: 0; letter-spacing: -.015em; margin-right: auto; text-wrap: balance; }
.month { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.month span { min-width: 92px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.month .iconbtn { border: none; }
h2 { font-family: var(--f-display); font-size: 18px; margin: 0 0 10px; letter-spacing: -.01em; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
h2 small { font-family: var(--f-body); font-weight: 400; font-size: 13px; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 820px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 2px; }
.tile .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.tile .val { font-family: var(--f-display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.tile .sub { font-size: 13px; color: var(--muted); }
.tile.alert { border-color: var(--red); background: var(--red-soft); }
.tile.alert .val { color: var(--red); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; }
td.acts { text-align: right; white-space: nowrap; }
td.acts .btn + .btn { margin-left: 6px; }
.clink { color: var(--ink); font-weight: 600; text-decoration: none; }
.clink:hover { color: var(--accent); text-decoration: underline; }
.meta { color: var(--muted); font-size: 13px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.p-overdue { color: var(--red); background: var(--red-soft); }
.p-soon { color: var(--amber); background: var(--amber-soft); }
.p-paid { color: var(--green); background: var(--green-soft); }
.p-upcoming, .p-paused { color: var(--muted); background: var(--surface-2); }
.p-partial { color: var(--amber); background: var(--amber-soft); }
.empty { padding: 28px 20px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.card-h { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.card-h .clink { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.prog { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.prog > b { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.prog.done > b { background: var(--green); }
.prog.behind > b { background: var(--amber); }
.dl { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 8px; align-items: center; }
.dl .nm { min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
.dl .ct { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; min-width: 52px; text-align: center; }
.dl .ct.full { color: var(--green); }
.summary { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.summary .prog { flex: 1; }
.banner { background: var(--accent-soft); border: 1px solid var(--accent); color: var(--ink); border-radius: 12px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.banner p { margin: 0; flex: 1; min-width: 220px; }
.detail-head { display: grid; gap: 6px; }
.detail-head .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.two { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .two { grid-template-columns: minmax(0, 1fr); } }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.hist td, .hist th { text-align: center; }
.hist td:first-child, .hist th:first-child { text-align: left; }
.cell-full { color: var(--green); font-weight: 600; }
.cell-short { color: var(--amber); font-weight: 600; }
.cell-zero { color: var(--red); font-weight: 600; }
.back { color: var(--muted); text-decoration: none; font-size: 14px; }
.back:hover { color: var(--accent); }
/* modal */
.overlay { position: fixed; inset: 0; background: rgba(10,20,30,.45); display: grid; place-items: center; z-index: 50; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--surface); color: var(--ink); border-radius: 14px; width: min(560px, 100%); max-height: 100%; overflow: auto; box-shadow: var(--shadow); border: 1px solid var(--line); }
.sheet header { padding: 16px 20px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheet header h3 { font-family: var(--f-display); font-size: 19px; margin: 0; }
.sheet .body { padding: 14px 20px; display: grid; gap: 12px; }
.sheet footer { padding: 12px 20px 18px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.sheet footer .left { margin-right: auto; }
label.f { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.f input, .f select, .f textarea, .drow input { font: inherit; font-weight: 400; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
.f textarea { resize: vertical; min-height: 70px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 480px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.drow { display: grid; grid-template-columns: minmax(0, 1fr) 84px 28px; gap: 8px; align-items: center; }
.hint { font-size: 12.5px; color: var(--muted); font-weight: 400; }
.msgbox { white-space: pre-wrap; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 14px; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.readonly [data-write] { display: none !important; }
.notice { font-size: 13px; color: var(--muted); }
@media (max-width: 560px) { .bar h1 { font-size: 22px; } .tile .val { font-size: 21px; } }
@media (prefers-reduced-motion: no-preference) { .prog > b { transition: width .25s ease; } }
</style>

<header class="top"><div class="wrap">
  <div class="brand"><i aria-hidden="true">₹</i>Retainer Desk</div>
  <nav class="tabs" aria-label="Sections">
    <a href="#overview" data-tab="overview">Overview</a>
    <a href="#clients" data-tab="clients">Clients</a>
  </nav>
  <button class="btn" id="settingsBtn" data-write>Settings</button>
</div></header>
<main class="wrap" id="main">
  <div class="empty"><strong>Loading your clients…</strong>Your payment schedule and deliverables will appear here.</div>
</main>
<div class="overlay" id="overlay" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  "use strict";
  // ---------- state ----------
  const S = {
    clients: [], payments: {}, deliveries: {},
    settings: { agency: "", currency: "INR", remindDays: 7 },
    loaded: { clients: false, payments: false, deliveries: false },
    confirmed: false, stale: false, noDb: false,
    month: null, canWrite: true,
  };
  const pendingDeliv = {};
  let db = null;

  // ---------- helpers ----------
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = (n) => String(n).padStart(2, "0");
  const iso = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d || 1); };
  const today = () => iso(new Date());
  function addMonths(s, n) {
    const d = parse(s), day = d.getDate();
    const t = new Date(d.getFullYear(), d.getMonth() + n, 1);
    const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
    t.setDate(Math.min(day, last));
    return iso(t);
  }
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
  const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
  const shiftYm = (ym, n) => addMonths(ym + "-01", n).slice(0, 7);
  const monthLabel = (ym) => parse(ym + "-01").toLocaleDateString("en-GB", { month: "short", year: "numeric" });
  const monthLong = (ym) => parse(ym + "-01").toLocaleDateString("en-GB", { month: "long", year: "numeric" });
  const fmtDate = (s) => parse(s).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const PLANS = { 1: "Monthly", 2: "Every 2 months", 3: "Quarterly (every 3 months)", 4: "Every 4 months", 6: "Every 6 months", 12: "Yearly" };
  const planShort = (c) => ({ 1: "Monthly", 2: "Every 2 mo", 3: "Every 3 mo", 4: "Every 4 mo", 6: "Every 6 mo", 12: "Yearly" }[c.cycle] || "Every " + c.cycle + " mo");
  function money(n) {
    const cur = S.settings.currency || "INR";
    try { return new Intl.NumberFormat(cur === "INR" ? "en-IN" : "en-US", { style: "currency", currency: cur, maximumFractionDigits: 0 }).format(n || 0); }
    catch (e) { return cur + " " + Math.round(n || 0); }
  }
  const remindDays = () => Number(S.settings.remindDays) || 7;

  // ---------- billing logic ----------
  function period(c, due) {
    const cyc = Number(c.cycle) || 1, key = due.slice(0, 7);
    const label = cyc === 1 ? monthLabel(key) : monthLabel(key) + " – " + monthLabel(shiftYm(key, cyc - 1));
    const pay = S.payments[c.id + "_" + key];
    const amount = Number(c.amount) || 0, paid = pay ? Number(pay.amount) || 0 : 0;
    const t = today(), late = due < t, balance = Math.max(0, amount - paid);
    let status;
    if (pay && paid >= amount) status = "paid";
    else if (late) status = "overdue";
    else if (daysBetween(t, due) <= remindDays()) status = "soon";
    else status = "upcoming";
    return { c, due, key, label, amount, paid, balance, pay, status, partial: !!pay && paid < amount, late, daysLate: late ? daysBetween(due, t) : 0, docId: c.id + "_" + key };
  }
  function periods(c, until) {
    const out = [];
    if (!c.startDate) return out;
    const cyc = Number(c.cycle) || 1;
    if (c.active === false && c.pausedOn && c.pausedOn < until) until = c.pausedOn;
    for (let i = 0; i < 400; i++) {
      const due = addMonths(c.startDate, i * cyc);
      if (due > until) break;
      out.push(period(c, due));
    }
    return out;
  }
  function nextUnpaid(c) {
    return periods(c, addMonths(today(), 13)).find((p) => p.status !== "paid") || null;
  }
  function clientStatus(c) {
    if (c.active === false) return { status: "paused", owed: 0 };
    const ps = periods(c, addDays(today(), remindDays()));
    const over = ps.filter((p) => p.status === "overdue");
    if (over.length) return { status: "overdue", owed: over.reduce((a, p) => a + p.balance, 0), n: over.length };
    if (ps.some((p) => p.status === "soon")) return { status: "soon" };
    return { status: "paid" };
  }
  const pillText = { overdue: "Overdue", soon: "Due soon", paid: "Paid", upcoming: "Upcoming", paused: "Paused", partial: "Part paid" };
  function pill(p) {
    if (p.partial && p.status !== "paid") return `<span class="pill p-${p.status === "overdue" ? "overdue" : "partial"}">Part paid${p.late ? " · late" : ""}</span>`;
    return `<span class="pill p-${p.status}">${pillText[p.status]}</span>`;
  }

  // ---------- deliverables ----------
  function delivDoc(cid, ym) {
    const k = cid + "_" + ym;
    return pendingDeliv[k] || S.deliveries[k] || { clientId: cid, month: ym, done: {} };
  }
  function delivProgress(c, ym) {
    const d = delivDoc(c.id, ym), items = c.deliverables || [];
    let tgt = 0, done = 0;
    items.forEach((it) => { const q = Number(it.qty) || 0; tgt += q; done += Math.min(q, Number(d.done?.[it.id]) || 0); });
    return { tgt, done, pct: tgt ? done / tgt : 0, doc: d };
  }
  function delivState(c, ym, pr) {
    if (!pr.tgt) return null;
    if (pr.done >= pr.tgt) return "done";
    const cur = today().slice(0, 7);
    if (ym < cur) return "missed";
    if (ym === cur) {
      const t = new Date(), dim = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
      if (pr.pct < t.getDate() / dim - 0.25) return "behind";
    }
    return "ontrack";
  }
  const delivPill = { done: '<span class="pill p-paid">All delivered</span>', missed: '<span class="pill p-overdue">Not completed</span>', behind: '<span class="pill p-soon">Behind</span>', ontrack: '<span class="pill p-upcoming">In progress</span>' };
  const clientStarted = (c, ym) => !c.startDate || c.startDate.slice(0, 7) <= ym;

  // ---------- writes ----------
  function errText(e) {
    const code = e && e.code;
    if (code === "invalid_argument") return "You don't have permission to change this tracker.";
    if (code === "quota_exceeded") return "Storage is full. Delete old clients to free space.";
    if (code === "resource_exhausted") return "Too many changes at once. Wait a moment and try again.";
    return "Couldn't save. Check your connection and try again.";
  }
  async function save(path, data) {
    try { await db.doc(path).set(data); return true; } catch (e) { toast(errText(e)); return false; }
  }
  async function remove(path) {
    try { await db.doc(path).delete(); return true; } catch (e) { toast(errText(e)); return false; }
  }
  const writers = {};
  function queueDeliv(k) {
    const w = writers[k] || (writers[k] = { busy: false, dirty: false, timer: null });
    w.dirty = true; clearTimeout(w.timer);
    w.timer = setTimeout(() => flushDeliv(k), 400);
  }
  async function flushDeliv(k) {
    const w = writers[k];
    if (w.busy || !w.dirty) return;
    w.busy = true; w.dirty = false;
    const data = JSON.parse(JSON.stringify(pendingDeliv[k]));
    try { await db.doc("deliveries/" + k).set(data); } catch (e) { toast(errText(e)); }
    w.busy = false;
    if (w.dirty) flushDeliv(k); else { delete pendingDeliv[k]; render(); }
  }
  function bumpDeliv(cid, did, n) {
    const ym = S.month, k = cid + "_" + ym;
    const cur = JSON.parse(JSON.stringify(delivDoc(cid, ym)));
    cur.clientId = cid; cur.month = ym; cur.done = cur.done || {};
    cur.done[did] = Math.max(0, (Number(cur.done[did]) || 0) + n);
    pendingDeliv[k] = cur;
    queueDeliv(k);
    render();
  }

  // ---------- toast & modal ----------
  let toastT;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2800); }
  function openModal(html, onReady) {
    $("#sheet").innerHTML = html; $("#overlay").hidden = false;
    const first = $("#sheet input, #sheet select, #sheet textarea");
    if (first) first.focus();
    onReady && onReady($("#sheet"));
  }
  function closeModal() { $("#overlay").hidden = true; $("#sheet").innerHTML = ""; }
  $("#overlay").addEventListener("click", (e) => { if (e.target.id === "overlay") closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#overlay").hidden) closeModal(); });
  const modalHead = (t) => `<header><h3>${esc(t)}</h3><button class="iconbtn" data-act="close" aria-label="Close">×</button></header>`;

  // ---------- views ----------
  function monthSwitch() {
    return `<div class="month" role="group" aria-label="Month"><button class="iconbtn" data-act="month" data-n="-1" aria-label="Previous month">‹</button><span>${monthLabel(S.month)}</span><button class="iconbtn" data-act="month" data-n="1" aria-label="Next month">›</button></div>`;
  }
  function exampleBanner() {
    if (!S.clients.some((c) => c.example)) return "";
    return `<div class="banner"><p><b>These are example clients</b> so you can see how the tracker works. Remove them when you're ready to add your own.</p><button class="btn" data-act="clear-examples" data-write>Remove examples</button><button class="btn primary" data-act="new-client" data-write>Add your first client</button></div>`;
  }
  function staleNote() {
    return S.stale ? `<p class="notice">Can't reach your saved data right now. What you see may be out of date.</p>` : "";
  }

  function viewOverview() {
    const t = today(), ym = S.month, horizon = addDays(t, remindDays());
    const active = S.clients.filter((c) => c.active !== false);
    let overdue = 0, overdueN = 0, soon = 0, soonN = 0, expected = 0, expectedN = 0, expectedPaid = 0, collected = 0;
    const follow = [];
    S.clients.forEach((c) => {
      const monthEnd = addDays(addMonths(ym + "-01", 1), -1);
      const ps = periods(c, monthEnd > horizon ? monthEnd : horizon);
      ps.forEach((p) => {
        const isFollow = c.active !== false && p.status !== "paid" && p.due <= horizon;
        if (p.status === "overdue") { overdue += p.balance; overdueN++; }
        if (p.status === "soon" && p.due <= horizon) { soon += p.balance; soonN++; }
        if (p.key === ym && c.active !== false) { expected += p.amount; expectedN++; if (p.status === "paid") expectedPaid++; }
        if (isFollow) follow.push(p);
      });
    });
    Object.values(S.payments).forEach((p) => { if ((p.paidOn || "").slice(0, 7) === ym) collected += Number(p.amount) || 0; });
    follow.sort((a, b) => (a.due < b.due ? -1 : 1));

    const rows = follow.map((p) => `<tr>
      <td><a class="clink" href="#client-${p.c.id}">${esc(p.c.name)}</a><div class="meta">${esc(p.label)} · ${planShort(p.c)}</div></td>
      <td class="num">${money(p.balance)}${p.partial ? `<div class="meta">of ${money(p.amount)}</div>` : ""}</td>
      <td>${fmtDate(p.due)}<div class="meta">${p.late ? p.daysLate + (p.daysLate === 1 ? " day" : " days") + " late" : p.due === t ? "Due today" : "in " + daysBetween(t, p.due) + " days"}</div></td>
      <td>${pill(p)}</td>
      <td class="acts"><button class="btn sm" data-act="remind" data-c="${p.c.id}" data-k="${p.key}">Reminder</button><button class="btn sm primary" data-act="pay" data-c="${p.c.id}" data-k="${p.key}" data-write>Mark paid</button></td>
    </tr>`).join("");

    const cards = active.filter((c) => (c.deliverables || []).length && clientStarted(c, ym)).map((c) => delivCard(c, ym, true)).join("");

    return `
      <div class="bar"><h1>Overview</h1>${monthSwitch()}<button class="btn primary" data-act="new-client" data-write>+ Add client</button></div>
      ${staleNote()}${exampleBanner()}
      <section class="stats" aria-label="Summary">
        <div class="tile ${overdue ? "alert" : ""}"><span class="lbl">Overdue now</span><span class="val">${money(overdue)}</span><span class="sub">${overdueN ? overdueN + (overdueN === 1 ? " payment" : " payments") + " late" : "Nobody is late"}</span></div>
        <div class="tile"><span class="lbl">Due in next ${remindDays()} days</span><span class="val">${money(soon)}</span><span class="sub">${soonN} ${soonN === 1 ? "payment" : "payments"}</span></div>
        <div class="tile"><span class="lbl">Collected · ${monthLabel(ym)}</span><span class="val">${money(collected)}</span><span class="sub">Payments received this month</span></div>
        <div class="tile"><span class="lbl">Billed · ${monthLabel(ym)}</span><span class="val">${money(expected)}</span><span class="sub">${expectedPaid} of ${expectedN} invoices paid</span></div>
      </section>
      <section>
        <h2>Payments to follow up <small>Overdue, plus anything due in the next ${remindDays()} days</small></h2>
        <div class="panel">${follow.length ? `<div class="scroll"><table><thead><tr><th>Client</th><th class="num">Amount</th><th>Due</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : `<div class="empty"><strong>Nothing to chase</strong>${S.clients.length ? "Every client is paid up for now." : "Add a client to start tracking payments."}</div>`}</div>
      </section>
      <section>
        <h2>Deliverables · ${monthLong(ym)} <small>Tap + as you deliver each item</small></h2>
        ${cards ? `<div class="cards">${cards}</div>` : `<div class="panel"><div class="empty"><strong>No deliverables for ${monthLabel(ym)}</strong>Add monthly deliverables (posts, reels, blogs…) when you add or edit a client.</div></div>`}
      </section>`;
  }

  function delivCard(c, ym, withName) {
    const pr = delivProgress(c, ym), st = delivState(c, ym, pr);
    const items = (c.deliverables || []).map((it) => {
      const n = Number(pr.doc.done?.[it.id]) || 0, q = Number(it.qty) || 0;
      return `<div class="nm">${esc(it.name)}</div><div class="ct ${n >= q && q ? "full" : ""}">${n} / ${q}</div>
        <button class="iconbtn" data-act="deliv" data-c="${c.id}" data-d="${it.id}" data-n="-1" aria-label="One less ${esc(it.name)}" data-write>−</button>
        <button class="iconbtn" data-act="deliv" data-c="${c.id}" data-d="${it.id}" data-n="1" aria-label="One more ${esc(it.name)}" data-write>+</button>`;
    }).join("");
    return `<div class="card">
      <div class="card-h">${withName ? `<a class="clink" href="#client-${c.id}">${esc(c.name)}</a>` : `<b>${monthLong(ym)}</b>`}${st ? delivPill[st] : ""}</div>
      <div class="summary"><div class="prog ${st === "done" ? "done" : st === "behind" || st === "missed" ? "behind" : ""}"><b style="width:${Math.round(pr.pct * 100)}%"></b></div><span>${pr.done}/${pr.tgt} · ${Math.round(pr.pct * 100)}%</span></div>
      <div class="dl">${items}</div>
    </div>`;
  }

  function viewClients() {
    const list = [...S.clients].sort((a, b) => (a.active === false) - (b.active === false) || String(a.name).localeCompare(String(b.name)));
    const rows = list.map((c) => {
      const cs = clientStatus(c), nx = c.active === false ? null : nextUnpaid(c), pr = delivProgress(c, S.month);
      const statusHtml = cs.status === "overdue" ? `<span class="pill p-overdue">${money(cs.owed)} overdue</span>` : `<span class="pill p-${cs.status}">${cs.status === "paid" ? "Paid up" : pillText[cs.status]}</span>`;
      return `<tr>
        <td><a class="clink" href="#client-${c.id}">${esc(c.name)}</a>${c.contact ? `<div class="meta">${esc(c.contact)}</div>` : ""}</td>
        <td>${planShort(c)}</td>
        <td class="num">${money(c.amount)}</td>
        <td>${nx ? fmtDate(nx.due) : "—"}</td>
        <td>${statusHtml}</td>
        <td>${pr.tgt ? `<div class="summary" style="min-width:120px"><div class="prog ${pr.done >= pr.tgt ? "done" : ""}"><b style="width:${Math.round(pr.pct * 100)}%"></b></div><span>${pr.done}/${pr.tgt}</span></div>` : '<span class="meta">—</span>'}</td>
      </tr>`;
    }).join("");
    return `
      <div class="bar"><h1>Clients</h1>${monthSwitch()}<button class="btn primary" data-act="new-client" data-write>+ Add client</button></div>
      ${staleNote()}${exampleBanner()}
      <div class="panel">${list.length ? `<div class="scroll"><table><thead><tr><th>Client</th><th>Billing</th><th class="num">Amount per bill</th><th>Next bill</th><th>Payment</th><th>Work · ${monthLabel(S.month)}</th></tr></thead><tbody>${rows}</tbody></table></div>` : `<div class="empty"><strong>No clients yet</strong>Add your first client with their billing cycle and monthly deliverables.</div>`}</div>`;
  }

  function viewClient(id) {
    const c = S.clients.find((x) => x.id === id);
    if (!c) return `<a class="back" href="#clients">← All clients</a><div class="panel"><div class="empty"><strong>Client not found</strong>It may have been deleted.</div></div>`;
    const t = today();
    let ps = periods(c, t);
    const nx = periods(c, addMonths(t, 13)).find((p) => p.due > t);
    if (nx) ps.push(nx);
    ps = ps.reverse();
    const owed = ps.filter((p) => p.status === "overdue").reduce((a, p) => a + p.balance, 0);
    const totalPaid = ps.reduce((a, p) => a + p.paid, 0);
    const rows = ps.map((p) => `<tr>
      <td>${esc(p.label)}</td><td>${fmtDate(p.due)}</td>
      <td class="num">${money(p.amount)}</td>
      <td class="num">${p.pay ? money(p.paid) + `<div class="meta">${p.pay.paidOn ? fmtDate(p.pay.paidOn) : ""}${p.pay.method ? " · " + esc(p.pay.method) : ""}</div>` : "—"}</td>
      <td>${pill(p)}</td>
      <td class="acts">${p.status !== "paid" ? `<button class="btn sm" data-act="remind" data-c="${c.id}" data-k="${p.key}">Reminder</button>` : ""}<button class="btn sm ${p.pay ? "" : "primary"}" data-act="pay" data-c="${c.id}" data-k="${p.key}" data-write>${p.pay ? "Edit" : "Mark paid"}</button></td>
    </tr>`).join("");

    const months = [];
    for (let i = 5; i >= 0; i--) { const m = shiftYm(S.month, -i); if (clientStarted(c, m)) months.push(m); }
    const items = c.deliverables || [];
    const hist = items.length && months.length ? `<section><h2>Deliverables history <small>Last ${months.length} months up to ${monthLabel(S.month)}</small></h2><div class="panel"><div class="scroll"><table class="hist"><thead><tr><th>Deliverable</th>${months.map((m) => `<th>${monthLabel(m)}</th>`).join("")}</tr></thead><tbody>${items.map((it) => `<tr><td>${esc(it.name)} <span class="meta">(${Number(it.qty) || 0}/mo)</span></td>${months.map((m) => {
      const n = Number(delivDoc(c.id, m).done?.[it.id]) || 0, q = Number(it.qty) || 0;
      const cls = n >= q ? "cell-full" : m < t.slice(0, 7) ? (n ? "cell-short" : "cell-zero") : "";
      return `<td class="${cls}">${n}/${q}</td>`;
    }).join("")}</tr>`).join("")}</tbody></table></div></div></section>` : "";

    return `
      <a class="back" href="#clients">← All clients</a>
      <div class="bar"><h1>${esc(c.name)}</h1>${monthSwitch()}</div>
      <div class="detail-head">
        <div class="meta">${PLANS[c.cycle] || "Every " + c.cycle + " months"} · ${money(c.amount)} per bill${c.active === false ? " · <b>Paused</b>" : ""}</div>
        <div class="acts" data-write><button class="btn" data-act="edit-client" data-c="${c.id}">Edit client</button><button class="btn" data-act="toggle-active" data-c="${c.id}">${c.active === false ? "Resume" : "Pause"}</button><button class="btn danger" data-act="delete-client" data-c="${c.id}">Delete</button></div>
      </div>
      <div class="two">
        <section><h2>Payment schedule <small>${owed ? `<b style="color:var(--red)">${money(owed)} overdue</b> · ` : ""}${money(totalPaid)} received so far</small></h2>
          <div class="panel">${ps.length ? `<div class="scroll"><table><thead><tr><th>Period</th><th>Due</th><th class="num">Amount</th><th class="num">Received</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : `<div class="empty">Set a first billing date to build the schedule.</div>`}</div>
        </section>
        <section style="display:grid;gap:16px">
          <div><h2>This month's work</h2>${items.length ? (clientStarted(c, S.month) ? delivCard(c, S.month, false) : `<div class="panel"><div class="empty">Work starts ${monthLabel(c.startDate.slice(0, 7))}.</div></div>`) : `<div class="panel"><div class="empty">No deliverables set. Use <b>Edit client</b> to add them.</div></div>`}</div>
          <div class="card"><b>Contact</b><dl class="kv">
            <dt>Person</dt><dd>${esc(c.contact) || "—"}</dd>
            <dt>Phone</dt><dd>${esc(c.phone) || "—"}</dd>
            <dt>Email</dt><dd>${esc(c.email) || "—"}</dd>
            <dt>Since</dt><dd>${c.startDate ? fmtDate(c.startDate) : "—"}</dd>
            ${c.notes ? `<dt>Notes</dt><dd>${esc(c.notes)}</dd>` : ""}
          </dl></div>
        </section>
      </div>
      ${hist}`;
  }

  function render() {
    const main = $("#main");
    document.body.classList.toggle("readonly", !S.canWrite);
    const r = (location.hash || "#overview").slice(1);
    const tab = r.startsWith("client-") || r === "clients" ? "clients" : "overview";
    document.querySelectorAll("nav.tabs a").forEach((a) => { if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    if (S.noDb) { main.innerHTML = `<div class="panel"><div class="empty"><strong>Sign in to use the tracker</strong>Open this page while signed in to claude.ai so your clients and payments can be saved.</div></div>`; return; }
    if (!S.loaded.clients) { main.innerHTML = `<div class="empty"><strong>${S.stale ? "Can't reach your saved data yet" : "Loading your clients…"}</strong>Your payment schedule and deliverables will appear here.</div>`; return; }
    main.innerHTML = r.startsWith("client-") ? viewClient(r.slice(7)) : r === "clients" ? viewClients() : viewOverview();
  }
  window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });

  // ---------- modals ----------
  function clientForm(c) {
    const isNew = !c;
    c = c || { name: "", contact: "", phone: "", email: "", cycle: 1, amount: "", startDate: today(), deliverables: [{ id: uid("d"), name: "", qty: "" }], notes: "" };
    const drow = (d) => `<div class="drow" data-id="${esc(d.id)}"><input aria-label="Deliverable" placeholder="e.g. Instagram reels" value="${esc(d.name)}"><input aria-label="Per month" type="number" min="0" placeholder="Qty" value="${esc(d.qty)}"><button type="button" class="iconbtn" data-act="drow-del" aria-label="Remove">×</button></div>`;
    openModal(`${modalHead(isNew ? "Add client" : "Edit client")}
      <form id="cform"><div class="body">
        <label class="f">Client / brand name<input id="f-name" required value="${esc(c.name)}"></label>
        <div class="grid2">
          <label class="f">Contact person<input id="f-contact" value="${esc(c.contact)}"></label>
          <label class="f">Phone / WhatsApp<input id="f-phone" value="${esc(c.phone)}"></label>
        </div>
        <label class="f">Email<input id="f-email" type="email" value="${esc(c.email)}"></label>
        <div class="grid2">
          <label class="f">How often they pay<select id="f-cycle">${Object.entries(PLANS).map(([k, v]) => `<option value="${k}" ${Number(c.cycle) === Number(k) ? "selected" : ""}>${v}</option>`).join("")}</select></label>
          <label class="f">Amount per bill (${esc(S.settings.currency)})<input id="f-amount" type="number" min="0" step="1" required value="${esc(c.amount)}"></label>
        </div>
        <label class="f">First billing date<input id="f-start" type="date" required value="${esc(c.startDate)}"><span class="hint">Each later bill falls on the same day, every billing cycle.</span></label>
        <div class="f" style="gap:8px">Monthly deliverables<span class="hint">What you deliver every month, and how many.</span>
          <div id="drows" style="display:grid;gap:8px">${(c.deliverables || []).map(drow).join("")}</div>
          <div><button type="button" class="btn sm" data-act="drow-add">+ Add deliverable</button></div>
        </div>
        <label class="f">Notes<textarea id="f-notes" placeholder="Payment terms, GST details, anything to remember">${esc(c.notes)}</textarea></label>
      </div>
      <footer><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">${isNew ? "Add client" : "Save changes"}</button></footer></form>`, (sheet) => {
      sheet.querySelector("[data-act=drow-add]").addEventListener("click", () => { $("#drows").insertAdjacentHTML("beforeend", drow({ id: uid("d"), name: "", qty: "" })); $("#drows .drow:last-child input").focus(); });
      $("#drows").addEventListener("click", (e) => { if (e.target.closest("[data-act=drow-del]")) e.target.closest(".drow").remove(); });
      $("#cform").addEventListener("submit", async (e) => {
        e.preventDefault();
        const deliverables = [...document.querySelectorAll("#drows .drow")].map((r) => {
          const [n, q] = r.querySelectorAll("input");
          return { id: r.dataset.id, name: n.value.trim(), qty: Math.max(0, parseInt(q.value, 10) || 0) };
        }).filter((d) => d.name);
        const data = {
          name: $("#f-name").value.trim(), contact: $("#f-contact").value.trim(), phone: $("#f-phone").value.trim(), email: $("#f-email").value.trim(),
          cycle: Number($("#f-cycle").value), amount: Number($("#f-amount").value) || 0, startDate: $("#f-start").value,
          deliverables, notes: $("#f-notes").value.trim(), active: isNew ? true : c.active !== false, example: isNew ? false : !!c.example,
        };
        if (!isNew && c.pausedOn) data.pausedOn = c.pausedOn;
        if (!data.name || !data.startDate) return;
        const id = isNew ? uid("c") : c.id;
        if (await save("clients/" + id, data)) { closeModal(); toast(isNew ? "Client added" : "Changes saved"); if (isNew) location.hash = "client-" + id; }
      });
    });
  }

  function payForm(cid, key) {
    const c = S.clients.find((x) => x.id === cid); if (!c) return;
    const due = periods(c, addMonths(today(), 13)).find((p) => p.key === key);
    if (!due) return;
    const p = due, ex = p.pay;
    const methods = ["UPI", "Bank transfer", "Cash", "Card", "Cheque", "Other"];
    openModal(`${modalHead((ex ? "Edit payment · " : "Mark paid · ") + c.name)}
      <form id="pform"><div class="body">
        <p class="meta" style="margin:0">${esc(p.label)} · ${money(p.amount)} due ${fmtDate(p.due)}</p>
        <div class="grid2">
          <label class="f">Amount received<input id="p-amt" type="number" min="0" step="1" required value="${ex ? esc(ex.amount) : p.amount}"></label>
          <label class="f">Received on<input id="p-date" type="date" required value="${ex ? esc(ex.paidOn) : today()}"></label>
        </div>
        <label class="f">Method<select id="p-method">${methods.map((m) => `<option ${ex && ex.method === m ? "selected" : ""}>${m}</option>`).join("")}</select></label>
        <label class="f">Note<input id="p-note" placeholder="Invoice no., reference…" value="${ex ? esc(ex.note) : ""}"></label>
        <span class="hint">Enter less than the full amount to record a part payment. The rest stays on the follow-up list.</span>
      </div>
      <footer>${ex ? `<button type="button" class="btn danger left" id="p-del">Remove payment</button>` : ""}<button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">Save payment</button></footer></form>`, () => {
      $("#pform").addEventListener("submit", async (e) => {
        e.preventDefault();
        const data = { clientId: cid, period: key, amount: Number($("#p-amt").value) || 0, paidOn: $("#p-date").value, method: $("#p-method").value, note: $("#p-note").value.trim() };
        if (await save("payments/" + p.docId, data)) { closeModal(); toast("Payment saved"); }
      });
      const del = $("#p-del");
      if (del) del.addEventListener("click", async () => { if (await remove("payments/" + p.docId)) { closeModal(); toast("Payment removed"); } });
    });
  }

  function reminderFor(c, p) {
    const who = (c.contact || c.name).split(" ")[0];
    const sign = S.settings.agency ? "\n\nThanks,\n" + S.settings.agency : "\n\nThank you!";
    const when = p.late ? "was due on " + fmtDate(p.due) : "is due on " + fmtDate(p.due);
    const amt = p.partial ? money(p.balance) + " (balance of " + money(p.amount) + ")" : money(p.amount);
    return `Hi ${who},\n\nHope you're doing well! This is a gentle reminder that the payment of ${amt} for ${p.label} ${when}.${p.late ? " Could you please process it at the earliest?" : " Please let me know once it's processed."}${sign}`;
  }
  function remindModal(cid, key) {
    const c = S.clients.find((x) => x.id === cid); if (!c) return;
    const p = periods(c, addMonths(today(), 13)).find((x) => x.key === key); if (!p) return;
    openModal(`${modalHead("Payment reminder · " + c.name)}
      <div class="body">
        <label class="f">Message<textarea id="r-msg" rows="9">${esc(reminderFor(c, p))}</textarea></label>
        <dl class="kv"><dt>Phone</dt><dd>${esc(c.phone) || "—"}</dd><dt>Email</dt><dd>${esc(c.email) || "—"}</dd></dl>
        <span class="hint">Copy the message and paste it into WhatsApp or email.</span>
      </div>
      <footer><button class="btn" data-act="close">Close</button><button class="btn primary" id="r-copy">Copy message</button></footer>`, () => {
      $("#r-copy").addEventListener("click", () => {
        const ta = $("#r-msg");
        const fallback = () => { ta.focus(); ta.select(); toast("Selected. Press Ctrl+C or Copy to copy it."); };
        try { navigator.clipboard.writeText(ta.value).then(() => toast("Message copied"), fallback); } catch (e) { fallback(); }
      });
    });
  }

  function settingsModal() {
    const s = S.settings;
    const curs = ["INR", "USD", "GBP", "EUR", "AED", "CAD", "AUD", "SGD"];
    openModal(`${modalHead("Settings")}
      <form id="sform"><div class="body">
        <label class="f">Agency name<input id="s-agency" value="${esc(s.agency)}" placeholder="Used to sign payment reminders"></label>
        <div class="grid2">
          <label class="f">Currency<select id="s-cur">${curs.map((c) => `<option ${c === s.currency ? "selected" : ""}>${c}</option>`).join("")}</select></label>
          <label class="f">Remind me this many days early<input id="s-days" type="number" min="0" max="60" value="${esc(remindDays())}"></label>
        </div>
      </div><footer><button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">Save</button></footer></form>`, () => {
      $("#sform").addEventListener("submit", async (e) => {
        e.preventDefault();
        const d = { agency: $("#s-agency").value.trim(), currency: $("#s-cur").value, remindDays: Math.max(0, parseInt($("#s-days").value, 10) || 0) };
        if (await save("settings/main", d)) { closeModal(); toast("Settings saved"); }
      });
    });
  }

  function confirmModal(title, text, label, fn) {
    openModal(`${modalHead(title)}<div class="body"><p style="margin:0">${text}</p></div><footer><button class="btn" data-act="close">Cancel</button><button class="btn primary" id="cf-ok" style="background:var(--red);border-color:var(--red)">${esc(label)}</button></footer>`, () => {
      $("#cf-ok").addEventListener("click", async () => { $("#cf-ok").disabled = true; await fn(); closeModal(); });
    });
  }
  async function deleteClientData(c) {
    for (const k of Object.keys(S.payments)) if (S.payments[k].clientId === c.id) await remove("payments/" + k);
    for (const k of Object.keys(S.deliveries)) if (S.deliveries[k].clientId === c.id) await remove("deliveries/" + k);
    await remove("clients/" + c.id);
  }

  // ---------- events ----------
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const a = b.dataset.act, cid = b.dataset.c;
    const c = cid && S.clients.find((x) => x.id === cid);
    switch (a) {
      case "close": closeModal(); break;
      case "month": S.month = shiftYm(S.month, Number(b.dataset.n)); render(); break;
      case "new-client": clientForm(null); break;
      case "edit-client": clientForm(c); break;
      case "pay": payForm(cid, b.dataset.k); break;
      case "remind": remindModal(cid, b.dataset.k); break;
      case "deliv": bumpDeliv(cid, b.dataset.d, Number(b.dataset.n)); break;
      case "toggle-active": if (c) { const d = { ...c }; delete d.id; const resume = c.active === false; d.active = resume; if (resume) delete d.pausedOn; else d.pausedOn = today(); save("clients/" + c.id, d).then((ok) => ok && toast(resume ? "Client resumed" : "Client paused")); } break;
      case "delete-client": if (c) confirmModal("Delete " + c.name + "?", "This removes the client, their payment records and deliverable history. It can't be undone. To stop tracking without losing history, use <b>Pause</b> instead.", "Delete client", async () => { await deleteClientData(c); location.hash = "clients"; toast("Client deleted"); }); break;
      case "clear-examples": confirmModal("Remove example clients?", "This deletes the example clients and their sample payments and deliverables.", "Remove examples", async () => { for (const x of S.clients.filter((x) => x.example)) await deleteClientData(x); toast("Examples removed"); }); break;
    }
  });
  $("#settingsBtn").addEventListener("click", settingsModal);

  // ---------- boot ----------
  S.month = today().slice(0, 7);
  render();
  (async () => {
    const cl = window.claude;
    db = cl ? await cl.use("db") : null;
    if (!db) { S.noDb = true; render(); return; }
    const user = await cl.use("user");
    if (user && typeof user.can === "function") { try { if ((await user.can("data.write")) === false) S.canWrite = false; } catch (e) {} }
    const timer = setTimeout(() => { if (!S.confirmed) { S.stale = true; render(); } }, 10000);
    const ok = (snap) => { if (!snap.metadata.fromCache && !S.confirmed) { S.confirmed = true; S.stale = false; clearTimeout(timer); } };
    const fail = () => { clearTimeout(timer); S.stale = true; S.loaded.clients = true; render(); };
    db.collection("clients").onSnapshot((s) => { S.clients = s.docs.map((d) => { const x = { ...d.data() }; x.id = d.id; return x; }); S.loaded.clients = true; ok(s); render(); }, fail);
    db.collection("payments").onSnapshot((s) => { const m = {}; s.docs.forEach((d) => (m[d.id] = d.data())); S.payments = m; ok(s); render(); }, fail);
    db.collection("deliveries").onSnapshot((s) => { const m = {}; s.docs.forEach((d) => (m[d.id] = d.data())); S.deliveries = m; ok(s); render(); }, fail);
    db.doc("settings/main").onSnapshot((d) => { if (d.exists) S.settings = { ...S.settings, ...d.data() }; render(); }, () => {});
  })();
})();
</script>
