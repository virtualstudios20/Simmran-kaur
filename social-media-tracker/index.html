<title>Social Media Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: header + tabs; summary strip; team member cards (filter); client rows with reels/posts counters for the current renewal cycle. */
:root {

}

  --accent: #9d92ff; --accent-ink: #15122e; --accent-soft: #27234a;
  --reel: #ff8a75; --reel-soft: #3d201b; --post: #6fb0ff; --post-soft: #172a42;
  --red: #ff8086; --red-soft: #3a1c20; --amber: #f2b45a; --amber-soft: #382912; --green: #70d49c; --green-soft: #15301f;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111118; --surface: #191922; --surface-2: #22222d; --ink: #e8e8f0; --muted: #9a9ab0; --line: #2d2d3a;
  --accent: #9d92ff; --accent-ink: #15122e; --accent-soft: #27234a;
  --reel: #ff8a75; --reel-soft: #3d201b; --post: #6fb0ff; --post-soft: #172a42;
  --red: #ff8086; --red-soft: #3a1c20; --amber: #f2b45a; --amber-soft: #382912; --green: #70d49c; --green-soft: #15301f;

.scroll { overflow-x: auto; }

td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
td.acts { text-align: right; white-space: nowrap; }
td.acts .btn + .btn { margin-left: 6px; }
.banner { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 12px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

.team-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 20px; align-items: start; }

.tlist { display: grid; }
.titem { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }

/* modal */
.overlay { position: fixed; inset: 0; background: rgba(12,12,24,.5); display: grid; place-items: center; z-index: 50; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }

.sheet header { padding: 16px 20px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheet header h3 { font-family: var(--f-display); font-size: 18px; margin: 0; overflow-wrap: anywhere; }

.sheet footer { padding: 12px 20px 18px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }

label.f { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.f input, .f select, .f textarea { font: inherit; font-weight: 400; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
.f textarea { resize: vertical; min-height: 64px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 480px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }
.hint { font-size: 12.5px; color: var(--muted); font-weight: 400; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatches label { cursor: pointer; }
.swatches input { position: absolute; opacity: 0; pointer-events: none; }
.swatches span { width: 28px; height: 28px; border-radius: 50%; display: block; border: 3px solid transparent; }
.swatches input:checked + span { border-color: var(--ink); }
.swatches input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 14px; z-index: 60; max-width: calc(100% - 32px); }
.notadmin [data-admin] { display: none !important; }
.readonly [data-count] { display: none !important; }
[data-ro] { display: none; }
.readonly [data-ro] { display: inline; }
.strip4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 900px) { .strip4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .strip4 .tile:first-child { grid-column: auto; } }
.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
@media (max-width: 400px) { .wgrid { grid-template-columns: minmax(0, 1fr); } }
.wcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.wcard.s-behind, .wcard.s-atrisk { border-left: 4px solid var(--amber); }

.wtop { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.wname { font-size: 16px; overflow-wrap: anywhere; }
.ctr.big .iconbtn { width: 40px; height: 40px; font-size: 20px; border-radius: 10px; }
.ctr.big .lab { align-items: center; }

.ctr.big .prog i { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--ink); border-radius: 1px; transform: translateX(-1px); }
.pace { font-size: 12.5px; color: var(--muted); }
.numin { width: 56px; font: inherit; font-weight: 600; font-size: 15px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; text-align: center; margin-right: 4px; font-variant-numeric: tabular-nums; }

<header class="top"><div class="wrap">
  <div class="brand"><i aria-hidden="true">▶</i>Social Media Tracker</div>
  <nav class="tabs" aria-label="Sections">
    <a href="#tracker" data-tab="tracker" data-admin>Tracker</a>
    <a href="#team" data-tab="team" data-admin>Team &amp; clients</a>
    <a href="#my-work" data-tab="my-work">Team view</a>
  </nav>
</div></header>
<main class="wrap" id="main">
  <div class="empty"><strong>Loading your team…</strong>Team members, their clients and this cycle's reels and posts will appear here.</div>
</main>
<div class="overlay" id="overlay" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  "use strict";
  const S = {
    team: [], clients: [], cycles: {},
    loaded: false, confirmed: false, stale: false, noDb: false, canCount: true, isAdmin: false, me: "", myId: null, claims: {}, work: {}, names: {},
    offset: 0, member: "all", search: "", sort: "renewal",
  };
  try { const m = localStorage.getItem("smt-member"); if (m) S.member = m; S.me = localStorage.getItem("smt-me") || ""; } catch (e) {}
  const pending = {};
  let db = null, userApi = null;
  const workSubs = {};
  const COLORS = 8;

  // ---------- helpers ----------
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = (n) => String(n).padStart(2, "0");
  const iso = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d || 1); };
  const today = () => iso(new Date());
  const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
  const fmt = (s) => parse(s).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  const fmtY = (s) => parse(s).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const ord = (n) => n + (n % 10 === 1 && n !== 11 ? "st" : n % 10 === 2 && n !== 12 ? "nd" : n % 10 === 3 && n !== 13 ? "rd" : "th");
  const initials = (n) => String(n || "?").trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
  const avatar = (m) => `<span class="av" style="background:var(--m${(m && m.color) || 0})" aria-hidden="true">${esc(m ? initials(m.name) : "?")}</span>`;
  const memberOf = (c) => S.team.find((m) => m.id === c.memberId) || null;

  // ---------- cycle logic ----------
  function dayIn(y, m, d) { const last = new Date(y, m + 1, 0).getDate(); return new Date(y, m, Math.min(d, last)); }
  // A cycle runs from the renewal date to the next renewal date (e.g. 5 Nov → 5 Dec).
  function cycleFor(c, offset) {
    const t = parse(today()), d = Number(c.renewalDay) || 1;
    let s = dayIn(t.getFullYear(), t.getMonth(), d);
    if (s > t) s = dayIn(t.getFullYear(), t.getMonth() - 1, d);
    s = dayIn(s.getFullYear(), s.getMonth() + offset, d);
    const r = dayIn(s.getFullYear(), s.getMonth() + 1, d);
    return { start: iso(s), renew: iso(r) };
  }
  // Counts for a client live in the assigned team member's own space (work/<account>/cycles) once their
  // account is linked; older counts in "cycles" are kept and used as the starting point.
  function cycleData(c, offset) {
    const cy = cycleFor(c, offset), k = c.id + "_" + cy.start;
    const m = memberOf(c), acct = m && m.accountId;
    const path = acct ? "work/" + acct + "/cycles/" + k : "cycles/" + k;
    const doc = pending[path] || (acct && S.work[acct] && S.work[acct][k]) || S.cycles[k] || {};
    const reels = Number(doc.reels) || 0, posts = Number(doc.posts) || 0;
    const tr = Number(c.reels) || 0, tp = Number(c.posts) || 0;
    const tgt = tr + tp, done = Math.min(reels, tr) + Math.min(posts, tp);
    const t = today(), len = daysBetween(cy.start, cy.renew);
    const over = t >= cy.renew, elapsed = over ? 1 : Math.max(0, daysBetween(cy.start, t)) / len;
    const daysLeft = over ? 0 : daysBetween(t, cy.renew);
    const pct = tgt ? done / tgt : 0;
    let status;
    if (c.active === false && offset === 0) status = "paused";
    else if (!tgt) status = "none";
    else if (done >= tgt) status = "done";
    else if (over) status = "missed";
    else if (daysLeft <= 5) status = "atrisk";
    else if (pct < elapsed - 0.15) status = "behind";
    else status = "ontrack";
    return { ...cy, key: k, path, reels, posts, tr, tp, tgt, done, pct, daysLeft, status, over, notStarted: !!c.startDate && c.startDate >= cy.renew };
  }
  const statusText = (d) => ({ done: "All done", missed: "Missed", atrisk: "Renews in " + d.daysLeft + (d.daysLeft === 1 ? " day" : " days"), behind: "Behind", ontrack: "On track", none: "No targets", paused: "Paused" }[d.status]);
  const offsetLabel = () => S.offset === 0 ? "Current cycle" : S.offset === -1 ? "Previous cycle" : Math.abs(S.offset) + " cycles ago";

  // ---------- writes ----------
  function errText(e) {
    const code = e && e.code;
    if (code === "invalid_argument") return "You don't have permission to change this tracker. Ask the owner for edit access.";
    if (code === "quota_exceeded") return "Storage is full. Delete old clients to free space.";
    if (code === "resource_exhausted") return "Too many changes at once. Wait a moment and try again.";
    return "Couldn't save. Check your connection and try again.";
  }
  async function save(path, data) { try { await db.doc(path).set(data); return true; } catch (e) { toast(errText(e)); return false; } }
  async function remove(path) { try { await db.doc(path).delete(); return true; } catch (e) { toast(errText(e)); return false; } }
  const writers = {};
  function queue(k) {
    const w = writers[k] || (writers[k] = { busy: false, dirty: false, timer: null });
    w.dirty = true; clearTimeout(w.timer); w.timer = setTimeout(() => flush(k), 400);
  }
  async function flush(k) {
    const w = writers[k]; if (w.busy || !w.dirty) return;
    w.busy = true; w.dirty = false;
    const data = { ...pending[k], updatedAt: new Date().toISOString() };
    try { await db.doc(k).set(data); } catch (e) {
      if (e && e.code === "invalid_argument") { delete pending[k]; toast("This change wasn't saved. You can only update clients assigned to you, after the owner approves your account."); w.busy = false; render(); return; }
      toast(errText(e));
    }
    w.busy = false;
    if (w.dirty) flush(k); else { delete pending[k]; render(); }
  }
  function mayCount(c) { return S.isAdmin || (!!myMember() && c.memberId === myMember().id); }
  function myMember() { return S.myId ? S.team.find((m) => m.accountId === S.myId) || null : null; }
  function bump(cid, field, n, absolute) {
    const c = S.clients.find((x) => x.id === cid); if (!c || !mayCount(c)) return;
    const d = cycleData(c, S.offset);
    const doc = { clientId: cid, memberId: c.memberId || "", start: d.start, renew: d.renew, reels: d.reels, posts: d.posts };
    doc[field] = Math.max(0, Math.min(999, absolute ? n : doc[field] + n));
    if (doc[field] === d[field]) { render(); return; }
    pending[d.path] = doc; queue(d.path); render();
  }

  // ---------- toast & modal ----------
  let toastT;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2800); }
  function openModal(html, onReady) {
    $("#sheet").innerHTML = html; $("#overlay").hidden = false;
    const first = $("#sheet input:not([type=radio]), #sheet select, #sheet textarea"); if (first) first.focus();
    onReady && onReady();
  }
  function closeModal() { $("#overlay").hidden = true; $("#sheet").innerHTML = ""; }
  $("#overlay").addEventListener("click", (e) => { if (e.target.id === "overlay") closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#overlay").hidden) closeModal(); });
  const head = (t) => `<header><h3>${esc(t)}</h3><button class="iconbtn" data-act="close" aria-label="Close">×</button></header>`;

  // ---------- views ----------
  function claimsBanner() {
    if (!S.isAdmin) return "";
    const list = Object.entries(S.claims).filter(([acct, c]) => { const m = S.team.find((x) => x.id === c.memberId); return m && m.accountId !== acct; });
    if (!list.length) return "";
    const missing = list.map(([a]) => a).filter((a) => !(a in S.names));
    if (missing.length) loadNames(missing);
    return list.map(([acct, c]) => { const m = S.team.find((x) => x.id === c.memberId); return `<div class="banner"><p><b>${esc(S.names[acct] || "A team account")}</b> says they are <b>${esc(m.name)}</b>. Approve to let this account update ${esc(m.name)}'s clients only.</p><button class="btn" data-act="reject-claim" data-a="${esc(acct)}">Not them</button><button class="btn primary" data-act="approve-claim" data-a="${esc(acct)}" data-m="${m.id}">Approve</button></div>`; }).join("");
  }
  async function loadNames(ids) {
    ids.forEach((i) => (S.names[i] = S.names[i] || ""));
    if (!userApi || typeof userApi.profiles !== "function") return;
    try { const ps = await userApi.profiles(ids); ids.forEach((i) => { if (ps && ps[i] && ps[i].name) S.names[i] = ps[i].name; }); render(); } catch (e) {}
  }
  function exampleBanner() {
    if (!S.team.some((m) => m.example) && !S.clients.some((c) => c.example)) return "";
    return `<div class="banner"><p><b>You're looking at sample data.</b> Remove it when you're ready to add your real team and clients.</p><button class="btn" data-act="clear-examples" data-admin>Remove sample data</button></div>`;
  }
  const staleNote = () => S.stale ? `<p class="notice">Can't reach your saved data right now. What you see may be out of date.</p>` : "";
  function cycSwitch() {
    return `<div class="cyc" role="group" aria-label="Cycle"><button class="iconbtn" data-act="cyc" data-n="-1" aria-label="Earlier cycle">‹</button><span>${offsetLabel()}</span><button class="iconbtn" data-act="cyc" data-n="1" aria-label="Later cycle" ${S.offset >= 0 ? "disabled" : ""}>›</button></div>`;
  }

  function viewTracker() {
    if (!S.team.length && !S.clients.length) {
      return `<div class="bar"><h1>Tracker</h1></div><div class="panel"><div class="empty"><strong>Set up your team</strong>Add your team members first, then add each client under the person who handles them, with their renewal date and monthly reels and posts.<div class="acts" data-admin><button class="btn primary" data-act="new-member">+ Add team member</button><button class="btn" data-act="sample">Try with sample data</button></div></div></div>`;
    }
    const active = S.clients.filter((c) => c.active !== false || S.offset !== 0);
    const rowsData = active.map((c) => ({ c, d: cycleData(c, S.offset) })).filter((x) => !x.d.notStarted);
    // summary (all clients, regardless of filter)
    let tr = 0, dr = 0, tp = 0, dp = 0, done = 0, attention = 0;
    rowsData.forEach(({ d }) => { tr += d.tr; tp += d.tp; dr += Math.min(d.reels, d.tr); dp += Math.min(d.posts, d.tp); if (d.status === "done") done++; if (["behind", "atrisk", "missed"].includes(d.status)) attention++; });
    // member cards
    const mstat = (filterFn) => { let r = 0, rt = 0, p = 0, pt = 0, n = 0, att = 0; rowsData.filter(filterFn).forEach(({ d }) => { n++; r += Math.min(d.reels, d.tr); rt += d.tr; p += Math.min(d.posts, d.tp); pt += d.tp; if (["behind", "atrisk", "missed"].includes(d.status)) att++; }); return { r, rt, p, pt, n, att }; };
    const mcard = (id, label, av, st) => `<button class="mcard" data-act="filter" data-m="${id}" aria-pressed="${S.member === id}">
      <div class="mhead">${av}<b>${esc(label)}</b></div>
      <div class="mstats"><span>${st.n} ${st.n === 1 ? "client" : "clients"}</span><span class="r">${st.r}/${st.rt} reels</span><span class="p">${st.p}/${st.pt} posts</span></div>
      <div class="meta">${st.att ? `<span style="color:var(--amber);font-weight:600">${st.att} need attention</span>` : st.n ? "Everyone on track" : "No clients yet"}</div></button>`;
    const unassigned = rowsData.some(({ c }) => !memberOf(c));
    const cards = mcard("all", "Whole team", `<span class="av" style="background:var(--accent);color:var(--accent-ink)" aria-hidden="true">★</span>`, mstat(() => true))
      + S.team.map((m) => mcard(m.id, m.name, avatar(m), mstat(({ c }) => c.memberId === m.id))).join("")
      + (unassigned ? mcard("none", "Unassigned", avatar(null), mstat(({ c }) => !memberOf(c))) : "");

    // filtered list
    const q = S.search.trim().toLowerCase();
    let list = rowsData.filter(({ c }) => S.member === "all" || (S.member === "none" ? !memberOf(c) : c.memberId === S.member));
    if (q) list = list.filter(({ c }) => String(c.name).toLowerCase().includes(q));
    const rank = { atrisk: 0, missed: 0, behind: 1, ontrack: 2, none: 3, done: 4, paused: 5 };
    list.sort((a, b) => S.sort === "status" ? (rank[a.d.status] - rank[b.d.status]) || (a.d.pct - b.d.pct)
      : S.sort === "name" ? String(a.c.name).localeCompare(String(b.c.name))
      : (a.d.renew < b.d.renew ? -1 : a.d.renew > b.d.renew ? 1 : 0));

    let body;
    if (!list.length) body = `<div class="panel"><div class="empty"><strong>No clients here</strong>${q ? "No client matches that search." : "Add a client and assign it to this team member."}<div class="acts" data-admin><button class="btn primary" data-act="new-client">+ Add client</button></div></div></div>`;
    else if (S.member === "all") {
      const groups = [...S.team.map((m) => ({ m, items: list.filter(({ c }) => c.memberId === m.id) })), { m: null, items: list.filter(({ c }) => !memberOf(c)) }].filter((g) => g.items.length);
      body = groups.map((g) => `<div class="group"><div class="ghead">${avatar(g.m)}<b>${esc(g.m ? g.m.name : "Unassigned")}</b><span>${g.items.length} ${g.items.length === 1 ? "client" : "clients"}</span></div>${g.items.map(rowHtml).join("")}</div>`).join("");
    } else body = `<div class="group">${list.map(rowHtml).join("")}</div>`;

    return `
      <div class="bar"><h1>Tracker</h1>${cycSwitch()}<button class="btn primary" data-act="new-client" data-admin>+ Add client</button></div>
      ${staleNote()}${claimsBanner()}${exampleBanner()}
      <section class="strip" aria-label="Summary">
        <div class="tile"><span class="lbl">${offsetLabel()}</span><span class="val">${done}<small> / ${rowsData.length}</small></span><span class="sub">clients fully delivered</span></div>
        <div class="tile reel"><span class="lbl">Reels posted</span><span class="val">${dr}<small> / ${tr}</small></span><span class="sub">${tr ? Math.round((dr / tr) * 100) : 0}% of target</span></div>
        <div class="tile post"><span class="lbl">Posts published</span><span class="val">${dp}<small> / ${tp}</small></span><span class="sub">${tp ? Math.round((dp / tp) * 100) : 0}% of target</span></div>
        <div class="tile ${attention ? "warn" : ""}"><span class="lbl">Need attention</span><span class="val">${attention}</span><span class="sub">Behind, renewing soon or missed</span></div>
        <div class="tile"><span class="lbl">Team</span><span class="val">${S.team.length}</span><span class="sub">${S.clients.filter((c) => c.active !== false).length} active clients</span></div>
      </section>
      <section><h2>Team <small>Pick a person to see only their clients</small></h2><div class="members">${cards}</div></section>
      <section>
        <div class="filters" style="margin-bottom:10px">
          <input id="q" type="search" placeholder="Search clients" value="${esc(S.search)}" aria-label="Search clients">
          <select id="sort" aria-label="Sort"><option value="renewal" ${S.sort === "renewal" ? "selected" : ""}>Sort: renewal date</option><option value="status" ${S.sort === "status" ? "selected" : ""}>Sort: needs attention first</option><option value="name" ${S.sort === "name" ? "selected" : ""}>Sort: name</option></select>
        </div>
        ${body}
      </section>`;
  }

  function counter(c, d, field) {
    const n = field === "reels" ? d.reels : d.posts, t = field === "reels" ? d.tr : d.tp;
    const label = field === "reels" ? "Reels" : "Posts";
    return `<div class="ctr ${field === "reels" ? "reel" : "post"}">
      <button class="iconbtn" data-act="bump" data-c="${c.id}" data-f="${field}" data-n="-1" aria-label="One less ${label.toLowerCase()} for ${esc(c.name)}" data-count>−</button>
      <div class="mid"><div class="lab"><span>${label}</span><span><b>${n}</b> / ${t}</span></div><div class="prog"><b style="width:${t ? Math.min(100, Math.round((n / t) * 100)) : 0}%"></b></div></div>
      <button class="iconbtn" data-act="bump" data-c="${c.id}" data-f="${field}" data-n="1" aria-label="One more ${label.toLowerCase()} for ${esc(c.name)}" data-count>+</button>
    </div>`;
  }
  function rowHtml({ c, d }) {
    const m = memberOf(c);
    return `<div class="row s-${d.status}">
      <div class="who"><button class="cname" data-act="client" data-c="${c.id}">${esc(c.name)}</button><span class="meta">${S.member === "all" ? "" : esc(m ? m.name : "Unassigned") + " · "}Renews on the ${ord(Number(c.renewalDay) || 1)}</span></div>
      <div class="when"><b>${fmt(d.start)} → ${fmt(d.renew)}</b><span class="meta">${d.over ? "Cycle ended" : d.daysLeft === 0 ? "Renews today" : d.daysLeft + (d.daysLeft === 1 ? " day" : " days") + " left"}</span></div>
      ${counter(c, d, "reels")}
      ${counter(c, d, "posts")}
      <div class="st"><span class="pill p-${d.status}">${statusText(d)}</span></div>
    </div>`;
  }

  function viewTeam() {
    const memberRows = S.team.map((m) => {
      const n = S.clients.filter((c) => c.memberId === m.id).length;
      return `<div class="titem">${avatar(m)}<div class="nm"><b>${esc(m.name)}</b><div class="meta">${esc(m.role || "")}${m.role ? " · " : ""}${n} ${n === 1 ? "client" : "clients"} · ${m.accountId ? '<span style="color:var(--green);font-weight:600">Account linked</span>' : "Account not linked"}</div></div><span data-admin><button class="btn sm" data-act="edit-member" data-m="${m.id}">Edit</button></span></div>`;
    }).join("");
    const clients = [...S.clients].sort((a, b) => String((memberOf(a) || {}).name || "~").localeCompare(String((memberOf(b) || {}).name || "~")) || String(a.name).localeCompare(String(b.name)));
    const crow = (c) => { const m = memberOf(c); return `<tr>
      <td><button class="cname" data-act="client" data-c="${c.id}">${esc(c.name)}</button>${c.active === false ? ' <span class="pill p-paused">Paused</span>' : ""}</td>
      <td><span style="display:inline-flex;align-items:center;gap:8px">${avatar(m)}${esc(m ? m.name : "Unassigned")}</span></td>
      <td>${ord(Number(c.renewalDay) || 1)}</td><td style="color:var(--reel);font-weight:600">${Number(c.reels) || 0}</td><td style="color:var(--post);font-weight:600">${Number(c.posts) || 0}</td>
      <td class="acts" data-admin><button class="btn sm" data-act="edit-client" data-c="${c.id}">Edit</button></td></tr>`; };
    return `
      <div class="bar"><h1>Team &amp; clients</h1></div>
      ${staleNote()}${claimsBanner()}${exampleBanner()}
      <div class="team-grid">
        <section><h2>Team members <small>${S.team.length}</small></h2>
          <div class="panel">${S.team.length ? `<div class="tlist">${memberRows}</div>` : `<div class="empty">No team members yet.</div>`}</div>
          <div style="margin-top:10px" data-admin><button class="btn primary" data-act="new-member">+ Add team member</button></div>
        </section>
        <section><h2>Clients <small>${S.clients.length}</small></h2>
          <div class="panel">${clients.length ? `<div class="scroll"><table><thead><tr><th>Client</th><th>Handled by</th><th>Renewal</th><th>Reels / mo</th><th>Posts / mo</th><th></th></tr></thead><tbody>${clients.map(crow).join("")}</tbody></table></div>` : `<div class="empty">No clients yet. Add team members first, then add clients under them.</div>`}</div>
          <div style="margin-top:10px" data-admin><button class="btn primary" data-act="new-client">+ Add client</button></div>
        </section>
      </div>`;
  }

  // ---------- team view: one team member fills in their own clients ----------
  function pace(d, field) {
    const done = field === "reels" ? d.reels : d.posts, tgt = field === "reels" ? d.tr : d.tp;
    const left = Math.max(0, tgt - done);
    const t = today(), len = daysBetween(d.start, d.renew);
    const elapsed = d.over ? 1 : Math.max(0, daysBetween(d.start, t)) / len;
    const shouldBe = Math.min(tgt, Math.ceil(tgt * elapsed));
    return { done, tgt, left, shouldBe, gap: Math.max(0, shouldBe - done) };
  }
  function paceLine(d, p, label) {
    if (!p.tgt) return `No ${label} this cycle`;
    if (!p.left) return `<span style="color:var(--green);font-weight:600">All ${p.tgt} ${label} done</span>`;
    if (d.over) return `<span style="color:var(--red);font-weight:600">${p.left} ${label} were not done</span>`;
    const days = d.daysLeft;
    const rate = days >= 7 ? `about ${Math.ceil(p.left / (days / 7))} a week` : `in the next ${days} ${days === 1 ? "day" : "days"}`;
    const gap = p.gap ? ` · <span style="color:var(--amber);font-weight:600">${p.gap} behind pace</span>` : "";
    return `<b>${p.left} left</b> by ${fmt(d.renew)} (${rate})${gap}`;
  }
  function bigCounter(c, d, field) {
    const p = pace(d, field), label = field === "reels" ? "Reels" : "Posts";
    return `<div class="ctr ${field === "reels" ? "reel" : "post"} big">
      <button class="iconbtn" data-act="bump" data-c="${c.id}" data-f="${field}" data-n="-1" aria-label="One less ${label.toLowerCase()} for ${esc(c.name)}" data-count>−</button>
      <div class="mid">
        <div class="lab"><span>${label} done</span><span><input class="numin" type="number" min="0" max="999" inputmode="numeric" id="n-${c.id}-${field}" data-set="${field}" data-c="${c.id}" value="${p.done}" aria-label="${label} done for ${esc(c.name)}" data-count><span class="ro" data-ro>${p.done}</span> of ${p.tgt}</span></div>
        <div class="prog"><b style="width:${p.tgt ? Math.min(100, Math.round((p.done / p.tgt) * 100)) : 0}%"></b>${p.tgt && !d.over && p.left ? `<i style="left:${Math.round((p.shouldBe / p.tgt) * 100)}%" title="Where you should be today"></i>` : ""}</div>
        <div class="pace">${paceLine(d, p, label.toLowerCase())}</div>
      </div>
      <button class="iconbtn" data-act="bump" data-c="${c.id}" data-f="${field}" data-n="1" aria-label="One more ${label.toLowerCase()} for ${esc(c.name)}" data-count>+</button>
    </div>`;
  }
  function viewMyWork() {
    let me, waiting = null;
    if (S.isAdmin) me = S.team.find((m) => m.id === S.me);
    else {
      if (!S.myId) return `<div class="panel"><div class="empty"><strong>Sign in to update your work</strong>Open this page while signed in to the claude.ai account the owner shared it with.</div></div>`;
      me = myMember();
      const cl = S.claims[S.myId];
      if (!me && cl && S.team.some((m) => m.id === cl.memberId)) { waiting = S.team.find((m) => m.id === cl.memberId); me = waiting; }
    }
    if (!me) {
      return `<div class="bar"><h1>Who are you?</h1></div>
        <p class="notice" style="font-size:14px">${S.isAdmin ? "Preview the team view as one of your team members." : "Pick your name. The owner will approve it once, and then you can update the reels and posts for your clients."}</p>
        ${S.team.length ? `<div class="members">${S.team.map((m) => `<button class="mcard" data-act="pick-me" data-m="${m.id}"><div class="mhead">${avatar(m)}<b>${esc(m.name)}</b></div><div class="meta">${esc(m.role || "")}${m.role ? " · " : ""}${S.clients.filter((c) => c.memberId === m.id && c.active !== false).length} clients</div></button>`).join("")}</div>`
          : `<div class="panel"><div class="empty"><strong>No team members yet</strong>The owner needs to add the team first.</div></div>`}`;
    }
    const mine = S.clients.filter((c) => c.memberId === me.id && (c.active !== false || S.offset !== 0))
      .map((c) => ({ c, d: cycleData(c, S.offset) })).filter((x) => !x.d.notStarted)
      .sort((a, b) => (a.d.renew < b.d.renew ? -1 : a.d.renew > b.d.renew ? 1 : 0));
    let rl = 0, pl = 0, behind = 0;
    mine.forEach(({ d }) => { rl += Math.max(0, d.tr - d.reels); pl += Math.max(0, d.tp - d.posts); if (["behind", "atrisk", "missed"].includes(d.status)) behind++; });
    const next = mine.find(({ d }) => d.status !== "done" && !d.over);
    const cards = mine.map(({ c, d }) => `<article class="wcard s-${d.status}">
      <div class="wtop"><div class="who"><b class="wname">${esc(c.name)}</b><span class="meta">${fmt(d.start)} → ${fmt(d.renew)} · ${d.over ? "cycle ended" : d.daysLeft === 0 ? "renews today" : `finish by ${fmt(d.renew)}, ${d.daysLeft} ${d.daysLeft === 1 ? "day" : "days"} left`}</span></div><span class="pill p-${d.status}">${statusText(d)}</span></div>
      ${bigCounter(c, d, "reels")}
      ${bigCounter(c, d, "posts")}
      ${c.notes ? `<div class="meta" style="white-space:pre-wrap">${esc(c.notes)}</div>` : ""}
    </article>`).join("");
    return `
      <div class="bar"><h1 style="display:flex;align-items:center;gap:10px">${avatar(me)} ${esc(me.name)}'s clients</h1>${cycSwitch()}${S.isAdmin || waiting ? `<button class="btn" data-act="change-me">${S.isAdmin ? "Switch person" : "Not " + esc(me.name) + "?"}</button>` : ""}</div>
      ${staleNote()}
      ${waiting ? `<div class="banner"><p><b>Waiting for approval.</b> The owner needs to approve that this account is ${esc(me.name)}. You'll be able to update counts as soon as they do.</p></div>` : ""}
      <section class="strip strip4" aria-label="Your summary">
        <div class="tile reel"><span class="lbl">Reels left</span><span class="val">${rl}</span><span class="sub">across ${mine.length} ${mine.length === 1 ? "client" : "clients"}</span></div>
        <div class="tile post"><span class="lbl">Posts left</span><span class="val">${pl}</span><span class="sub">across ${mine.length} ${mine.length === 1 ? "client" : "clients"}</span></div>
        <div class="tile ${behind ? "warn" : ""}"><span class="lbl">Need attention</span><span class="val">${behind}</span><span class="sub">Behind, renewing soon or missed</span></div>
        <div class="tile"><span class="lbl">Next deadline</span><span class="val" style="font-size:20px">${next ? fmt(next.d.renew) : "—"}</span><span class="sub">${next ? esc(next.c.name) : "Nothing pending"}</span></div>
      </section>
      <p class="notice">Tap <b>+</b> each time a reel or post goes live, or type the total. The small mark on each bar shows where you should be by today.</p>
      ${mine.length ? `<div class="wgrid">${cards}</div>` : `<div class="panel"><div class="empty"><strong>No clients assigned to you</strong>Ask the owner to assign your clients to you.</div></div>`}`;
  }

  function render() {
    const main = $("#main");
    document.body.classList.toggle("readonly", !(S.isAdmin || myMember()));
    document.body.classList.toggle("notadmin", !S.isAdmin);
    let r = (location.hash || (S.isAdmin ? "#tracker" : "#my-work")).slice(1);
    if (!S.isAdmin && S.loaded) r = "my-work";
    const tab = r === "team" ? "team" : r === "my-work" ? "my-work" : "tracker";
    document.querySelectorAll("nav.tabs a").forEach((a) => { if (a.dataset.tab === tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    if (S.noDb) { main.innerHTML = `<div class="panel"><div class="empty"><strong>Sign in to use the tracker</strong>Open this page while signed in to claude.ai so your team's work can be saved.</div></div>`; return; }
    if (!S.loaded) { main.innerHTML = `<div class="empty"><strong>${S.stale ? "Can't reach your saved data yet" : "Loading your team…"}</strong>Team members, their clients and this cycle's reels and posts will appear here.</div>`; return; }
    if (S.member !== "all" && S.member !== "none" && !S.team.some((m) => m.id === S.member)) S.member = "all";
    const ae = document.activeElement, focusId = ae && main.contains(ae) && ae.id;
    const typed = focusId && ae.tagName === "INPUT" ? ae.value : null;
    const sel = focusId === "q" ? [ae.selectionStart, ae.selectionEnd] : null;
    main.innerHTML = tab === "team" ? viewTeam() : tab === "my-work" ? viewMyWork() : viewTracker();
    if (focusId) { const el = document.getElementById(focusId); if (el) { if (typed !== null) el.value = typed; el.focus(); if (sel) { try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } } }
  }
  window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });

  // ---------- modals ----------
  function memberForm(m) {
    const isNew = !m;
    m = m || { name: "", role: "", color: S.team.length % COLORS };
    const sw = Array.from({ length: COLORS }, (_, i) => `<label><input type="radio" name="mcolor" value="${i}" ${Number(m.color) === i ? "checked" : ""} aria-label="Colour ${i + 1}"><span style="background:var(--m${i})"></span></label>`).join("");
    const n = isNew ? 0 : S.clients.filter((c) => c.memberId === m.id).length;
    openModal(`${head(isNew ? "Add team member" : "Edit team member")}
      <form id="mform"><div class="body">
        <label class="f">Name<input id="m-name" required value="${esc(m.name)}"></label>
        <label class="f">Role<input id="m-role" placeholder="e.g. Social media executive" value="${esc(m.role)}"></label>
        <div class="f">Colour<div class="swatches">${sw}</div></div>
        ${isNew ? "" : m.accountId ? `<div class="f">Linked account<span class="hint" style="font-size:14px;color:var(--ink)">${esc(S.names[m.accountId] || "Linked")} · can update counts for ${esc(m.name)}'s clients</span><label class="hint" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="m-unlink-flag" style="width:auto"> Unlink this account when I save</label></div>` : `<div class="f">Linked account<span class="hint">Not linked yet. Share the page with ${esc(m.name)} as an Editor. When they open it and pick their name, you'll be asked to approve.</span><input type="checkbox" id="m-unlink-flag" hidden></div>`}
        <div id="m-confirm" hidden class="banner" style="border-color:var(--red);background:var(--red-soft)"><p>Remove ${esc(m.name)}? Their ${n} ${n === 1 ? "client moves" : "clients move"} to Unassigned. Nothing else is deleted.</p><button type="button" class="btn danger" id="m-del-yes">Remove</button></div>
      </div>
      <footer>${isNew ? "" : `<button type="button" class="btn danger left" id="m-del">Remove member</button>`}<button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">${isNew ? "Add member" : "Save"}</button></footer></form>`, () => {
      $("#mform").addEventListener("submit", async (e) => {
        e.preventDefault();
        const data = { name: $("#m-name").value.trim(), role: $("#m-role").value.trim(), color: Number((document.querySelector("input[name=mcolor]:checked") || {}).value) || 0, example: isNew ? false : !!m.example };
        if (!data.name) return;
        if (!isNew && m.accountId && !$("#m-unlink-flag").checked) data.accountId = m.accountId;
        if (await save("team/" + (isNew ? uid("m") : m.id), data)) { closeModal(); toast(isNew ? "Team member added" : "Saved"); }
      });
      const del = $("#m-del");
      if (del) {
        del.addEventListener("click", () => { $("#m-confirm").hidden = false; });
        $("#m-del-yes").addEventListener("click", async () => {
          for (const c of S.clients.filter((c) => c.memberId === m.id)) { const d = { ...c }; delete d.id; d.memberId = ""; await save("clients/" + c.id, d); }
          if (await remove("team/" + m.id)) { closeModal(); toast("Team member removed"); }
        });
      }
    });
  }

  function clientForm(c) {
    const isNew = !c;
    const defMember = S.member !== "all" && S.member !== "none" ? S.member : (S.team[0] || {}).id || "";
    c = c || { name: "", memberId: defMember, renewalDay: new Date().getDate(), reels: 8, posts: 12, startDate: "", notes: "", active: true };
    openModal(`${head(isNew ? "Add client" : "Edit client")}
      <form id="cform"><div class="body">
        <label class="f">Client name<input id="c-name" required value="${esc(c.name)}"></label>
        <label class="f">Handled by<select id="c-member"><option value="">Unassigned</option>${S.team.map((m) => `<option value="${m.id}" ${c.memberId === m.id ? "selected" : ""}>${esc(m.name)}</option>`).join("")}</select></label>
        <div class="grid3">
          <label class="f">Renewal day<input id="c-day" type="number" min="1" max="31" required value="${esc(c.renewalDay)}"></label>
          <label class="f">Reels per month<input id="c-reels" type="number" min="0" required value="${esc(c.reels)}"></label>
          <label class="f">Posts per month<input id="c-posts" type="number" min="0" required value="${esc(c.posts)}"></label>
        </div>
        <span class="hint" id="c-hint"></span>
        <label class="f">Notes<textarea id="c-notes" placeholder="Platforms, posting days, brand guidelines…">${esc(c.notes)}</textarea></label>
        <div id="c-confirm" hidden class="banner" style="border-color:var(--red);background:var(--red-soft)"><p>Delete ${esc(c.name)} and all its cycle history? This can't be undone. To stop tracking but keep history, use Pause instead.</p><button type="button" class="btn danger" id="c-del-yes">Delete</button></div>
      </div>
      <footer>${isNew ? "" : `<button type="button" class="btn danger left" id="c-del">Delete</button><button type="button" class="btn" id="c-pause">${c.active === false ? "Resume" : "Pause"}</button>`}<button type="button" class="btn" data-act="close">Cancel</button><button class="btn primary" type="submit">${isNew ? "Add client" : "Save"}</button></footer></form>`, () => {
      const hint = () => { const d = Math.min(31, Math.max(1, parseInt($("#c-day").value, 10) || 1)); const cy = cycleFor({ renewalDay: d }, 0); $("#c-hint").textContent = `Current cycle: ${fmtY(cy.start)} → ${fmtY(cy.renew)}. Reels and posts are counted within each cycle.`; };
      $("#c-day").addEventListener("input", hint); hint();
      $("#cform").addEventListener("submit", async (e) => {
        e.preventDefault();
        const data = {
          name: $("#c-name").value.trim(), memberId: $("#c-member").value,
          renewalDay: Math.min(31, Math.max(1, parseInt($("#c-day").value, 10) || 1)),
          reels: Math.max(0, parseInt($("#c-reels").value, 10) || 0), posts: Math.max(0, parseInt($("#c-posts").value, 10) || 0),
          notes: $("#c-notes").value.trim(), active: isNew ? true : c.active !== false, example: isNew ? false : !!c.example,
          startDate: isNew ? cycleFor({ renewalDay: parseInt($("#c-day").value, 10) || 1 }, 0).start : (c.startDate || ""),
        };
        if (!data.name) return;
        if (await save("clients/" + (isNew ? uid("c") : c.id), data)) { closeModal(); toast(isNew ? "Client added" : "Saved"); }
      });
      if (!isNew) {
        $("#c-del").addEventListener("click", () => { $("#c-confirm").hidden = false; });
        $("#c-del-yes").addEventListener("click", async () => { await deleteClient(c); closeModal(); toast("Client deleted"); });
        $("#c-pause").addEventListener("click", async () => { const d = { ...c }; delete d.id; d.active = c.active === false; if (await save("clients/" + c.id, d)) { closeModal(); toast(d.active ? "Client resumed" : "Client paused"); } });
      }
    });
  }
  async function approveClaim(acct, mid) {
    for (const m of S.team) if (m.accountId === acct && m.id !== mid) { const d = { ...m }; delete d.id; delete d.accountId; await save("team/" + m.id, d); }
    const m = S.team.find((x) => x.id === mid); if (!m) return;
    const d = { ...m }; delete d.id; d.accountId = acct;
    if (await save("team/" + mid, d)) toast(m.name + " can now update their clients");
  }
  function syncWorkSubs() {
    const want = new Set(S.isAdmin ? S.team.map((m) => m.accountId).filter(Boolean) : (S.myId ? [S.myId] : []));
    for (const a of Object.keys(workSubs)) if (!want.has(a)) { workSubs[a](); delete workSubs[a]; delete S.work[a]; }
    for (const a of want) if (!workSubs[a]) {
      try { workSubs[a] = db.collection("work/" + a + "/cycles").onSnapshot((s) => { const m = {}; s.docs.forEach((d) => (m[d.id] = d.data())); S.work[a] = m; render(); }, () => {}); } catch (e) {}
    }
  }
  async function deleteClient(c) {
    for (const k of Object.keys(S.cycles)) if (S.cycles[k].clientId === c.id) await remove("cycles/" + k);
    for (const a of Object.keys(S.work)) for (const k of Object.keys(S.work[a])) if (S.work[a][k].clientId === c.id) await remove("work/" + a + "/cycles/" + k);
    await remove("clients/" + c.id);
  }

  function clientModal(cid) {
    const c = S.clients.find((x) => x.id === cid); if (!c) return;
    const m = memberOf(c), rows = [];
    for (let i = 0; i > -6; i--) { const d = cycleData(c, i); if (d.notStarted) break; rows.push(d); }
    openModal(`${head(c.name)}
      <div class="body">
        <div class="meta" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${avatar(m)} ${esc(m ? m.name : "Unassigned")} · Renews on the ${ord(Number(c.renewalDay) || 1)} · <span style="color:var(--reel);font-weight:600">${Number(c.reels) || 0} reels</span> + <span style="color:var(--post);font-weight:600">${Number(c.posts) || 0} posts</span> a month</div>
        ${c.notes ? `<p style="margin:0;white-space:pre-wrap">${esc(c.notes)}</p>` : ""}
        <div class="panel"><div class="scroll"><table><thead><tr><th>Cycle</th><th>Reels</th><th>Posts</th><th>Status</th></tr></thead><tbody>
          ${rows.map((d) => `<tr><td>${fmt(d.start)} → ${fmt(d.renew)}</td><td style="color:var(--reel);font-weight:600">${d.reels}/${d.tr}</td><td style="color:var(--post);font-weight:600">${d.posts}/${d.tp}</td><td><span class="pill p-${d.status}">${statusText(d)}</span></td></tr>`).join("")}
        </tbody></table></div></div>
        <span class="hint">To correct an earlier cycle, switch to it with the cycle arrows on the Tracker.</span>
      </div>
      <footer><button class="btn" data-act="close">Close</button><button class="btn primary" data-act="edit-client" data-c="${c.id}" data-admin>Edit client</button></footer>`);
  }

  async function loadSample() {
    const t = new Date().getDate();
    const day = (k) => ((t + k + 30) % 28) + 1;
    const team = [{ id: "mexriya", name: "Riya (sample)", role: "Social media executive", color: 3 }, { id: "mexkaran", name: "Karan (sample)", role: "Content creator", color: 2 }];
    const clients = [
      { id: "cexa", name: "Sample – Glow Skin Clinic", memberId: "mexriya", renewalDay: 5, reels: 8, posts: 12, r: 6, p: 9 },
      { id: "cexb", name: "Sample – Urban Bakehouse", memberId: "mexriya", renewalDay: day(3), reels: 6, posts: 10, r: 1, p: 3 },
      { id: "cexc", name: "Sample – Peak Fitness", memberId: "mexriya", renewalDay: day(-10), reels: 4, posts: 8, r: 4, p: 8 },
      { id: "cexd", name: "Sample – Bloom Florist", memberId: "mexkaran", renewalDay: day(12), reels: 10, posts: 15, r: 2, p: 4 },
      { id: "cexe", name: "Sample – Spice Route Café", memberId: "mexkaran", renewalDay: 20, reels: 6, posts: 12, r: 3, p: 7 },
    ];
    for (const m of team) { const d = { ...m, example: true }; delete d.id; if (!(await save("team/" + m.id, d))) return; }
    for (const c of clients) {
      const d = { name: c.name, memberId: c.memberId, renewalDay: c.renewalDay, reels: c.reels, posts: c.posts, notes: "", active: true, example: true, startDate: "" };
      await save("clients/" + c.id, d);
      const cy = cycleFor(d, 0);
      await save("cycles/" + c.id + "_" + cy.start, { clientId: c.id, memberId: c.memberId, start: cy.start, renew: cy.renew, reels: c.r, posts: c.p });
    }
    toast("Sample data added");
  }
  async function clearSample() {
    for (const c of S.clients.filter((c) => c.example)) await deleteClient(c);
    for (const m of S.team.filter((m) => m.example)) await remove("team/" + m.id);
    S.member = "all"; toast("Sample data removed");
  }

  // ---------- events ----------
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const a = b.dataset.act;
    switch (a) {
      case "close": closeModal(); break;
      case "cyc": S.offset = Math.min(0, S.offset + Number(b.dataset.n)); render(); break;
      case "filter": S.member = b.dataset.m; try { localStorage.setItem("smt-member", S.member); } catch (err) {} render(); break;
      case "bump": bump(b.dataset.c, b.dataset.f, Number(b.dataset.n)); break;
      case "pick-me": if (!S.isAdmin) { if (S.myId) save("work/" + S.myId, { memberId: b.dataset.m, at: new Date().toISOString() }).then((ok) => ok && toast("Sent to the owner for approval")); break; }
        S.me = b.dataset.m; try { localStorage.setItem("smt-me", S.me); } catch (err) {} S.offset = 0; render(); window.scrollTo(0, 0); break;
      case "approve-claim": approveClaim(b.dataset.a, b.dataset.m); break;
      case "reject-claim": remove("work/" + b.dataset.a).then((ok) => ok && toast("Request dismissed")); break;
      case "change-me": if (!S.isAdmin) { if (S.myId) remove("work/" + S.myId); break; }
        S.me = ""; try { localStorage.removeItem("smt-me"); } catch (err) {} render(); break;
      case "client": clientModal(b.dataset.c); break;
      case "new-client": clientForm(null); break;
      case "edit-client": clientForm(S.clients.find((x) => x.id === b.dataset.c)); break;
      case "new-member": memberForm(null); break;
      case "edit-member": memberForm(S.team.find((x) => x.id === b.dataset.m)); break;
      case "sample": b.disabled = true; loadSample(); break;
      case "clear-examples": b.disabled = true; clearSample(); break;
    }
  });
  document.addEventListener("input", (e) => { if (e.target.id === "q") { S.search = e.target.value; render(); } });
  document.addEventListener("change", (e) => {
    if (e.target.id === "sort") { S.sort = e.target.value; render(); }
    if (e.target.dataset && e.target.dataset.set) { const v = parseInt(e.target.value, 10); bump(e.target.dataset.c, e.target.dataset.set, isNaN(v) ? 0 : v, true); }
  });

  // ---------- boot ----------
  render();
  (async () => {
    const cl = window.claude;
    db = cl ? await cl.use("db") : null;
    if (!db) { S.noDb = true; render(); return; }
    const user = await cl.use("user");
    userApi = user;
    if (user) { try { S.isAdmin = !!(await user.isOwner()); } catch (e) {} try { S.myId = await user.id(); } catch (e) {} }
    const timer = setTimeout(() => { if (!S.confirmed) { S.stale = true; render(); } }, 10000);
    const got = { team: false, clients: false };
    const ok = (snap, which) => { if (which) got[which] = true; if (got.team && got.clients) S.loaded = true; if (!snap.metadata.fromCache && !S.confirmed) { S.confirmed = true; S.stale = false; clearTimeout(timer); } };
    const fail = () => { clearTimeout(timer); S.stale = true; S.loaded = true; render(); };
    const withId = (d) => { const x = { ...d.data() }; x.id = d.id; return x; };
    db.collection("team").onSnapshot((s) => { S.team = s.docs.map(withId).sort((a, b) => String(a.name).localeCompare(String(b.name))); ok(s, "team"); syncWorkSubs(); const ids = S.team.map((m) => m.accountId).filter((a) => a && !(a in S.names)); if (ids.length && S.isAdmin) loadNames(ids); render(); }, fail);
    if (S.isAdmin) db.collection("work").onSnapshot((s) => { const m = {}; s.docs.forEach((d) => { const x = d.data(); if (x && x.memberId) m[d.id] = x; }); S.claims = m; render(); }, () => {});
    else if (S.myId) db.doc("work/" + S.myId).onSnapshot((d) => { S.claims = d.exists && d.data().memberId ? { [S.myId]: d.data() } : {}; render(); }, () => {});
    db.collection("clients").onSnapshot((s) => { S.clients = s.docs.map(withId); ok(s, "clients"); render(); }, fail);
    db.collection("cycles").onSnapshot((s) => { const m = {}; s.docs.forEach((d) => (m[d.id] = d.data())); S.cycles = m; ok(s); render(); }, fail);
  })();
})();
</script>
